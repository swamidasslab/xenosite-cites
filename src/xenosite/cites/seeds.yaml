# Curated XenoSite-family seed papers (methods / tools / named products).
# Sources: xenosite.org cite blocks, OpenAlex Swamidass works, lab CITATION.cff.
# Citation payloads live under artifacts/ (gitignored).
#
# tags: product or method family labels used in filtering later.

papers:
  # --- CYP SOM lineage ---
  - id: zaretzki-2012-rs-webpredictor
    doi: 10.1093/bioinformatics/bts705
    title: "RS-WebPredictor: a server for predicting CYP-mediated sites of metabolism on drug-like molecules"
    year: 2012
    tags: [som, server, predecessor]
    notes: Pre-XenoSite RS-Predictor web server.

  - id: zaretzki-2013-xenosite
    doi: 10.1021/ci400518g
    title: "XenoSite: Accurately Predicting CYP-Mediated Sites of Metabolism with Neural Networks"
    year: 2013
    tags: [xenosite, som, cyp]
    notes: Foundational CYP SOM neural-network paper.

  - id: matlock-2015-xenosite-server
    doi: 10.1093/bioinformatics/btu761
    title: "XenoSite server: a web-available site of metabolism prediction tool"
    year: 2015
    tags: [xenosite, som, server]
    notes: Web server companion to the CYP SOM models.

  - id: zaretzki-2015-xenosite-regions
    doi: 10.1093/bioinformatics/btv100
    title: "Extending P450 site-of-metabolism models with region-resolution data"
    year: 2015
    tags: [xenosite, som, regions]
    notes: Region-resolution extension of P450 SOM models (XenoSite Regions).

  # --- Reactivity / SOR ---
  - id: hughes-2015-gsh-reactivity
    doi: 10.1021/acs.chemrestox.5b00017
    title: "Site of Reactivity Models Predict Molecular Reactivity of Diverse Chemicals with Glutathione"
    year: 2015
    tags: [xenosite, reactivity, gsh]
    notes: GSH site-of-reactivity models; cited on xenosite.org/reactivity.

  - id: hughes-2016-macromolecule-reactivity
    doi: 10.1021/acscentsci.6b00162
    title: "Modeling Reactivity to Biological Macromolecules with a Deep Multitask Network"
    year: 2016
    tags: [xenosite, reactivity, dna, protein]
    notes: DNA/protein multitask reactivity; cited on xenosite.org/reactivity.

  - id: matlock-2018-promiscuous-reactivity
    doi: 10.1021/acs.jcim.8b00104
    title: "Modeling Small-Molecule Reactivity Identifies Promiscuous Bioactive Compounds"
    year: 2018
    tags: [xenosite, reactivity]
    notes: Reactivity modeling for promiscuous bioactives.

  # --- Epoxidation / quinonation / N-dealkylation ---
  - id: hughes-2015-epoxidation
    doi: 10.1021/acscentsci.5b00131
    title: "Modeling Epoxidation of Drug-like Molecules with a Deep Machine Learning Network"
    year: 2015
    tags: [xenosite, epoxidation]
    notes: Site-of-epoxidation model; cited on xenosite.org.

  - id: hughes-2017-quinone
    doi: 10.1021/acs.chemrestox.6b00385
    title: "Deep Learning to Predict the Formation of Quinone Species in Drug Metabolism"
