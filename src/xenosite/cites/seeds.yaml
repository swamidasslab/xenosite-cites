    year: 2018
    tags: [xenosite, n-dealkylation]
    notes: N-dealkylation bioactivation; cited on xenosite.org.

  # --- Structural alerts (CASA) ---
  - id: dang-2017-casa
    doi: 10.1021/acs.chemrestox.6b00336
    title: "Computational Approach to Structural Alerts: Furans, Phenols, Nitroaromatics, and Thiophenes"
    year: 2017
    tags: [casa, structural-alerts, xenosite]
    notes: CASA — computational approach to structural alerts.

  # --- Phase II / UGT ---
  - id: dang-2016-ugt
    doi: 10.1093/bioinformatics/btw350
    title: "A simple model predicts UGT-mediated metabolism"
    year: 2016
    tags: [xenosite, ugt]
    notes: UGT SOM model; cited on xenosite.org.

  # --- Rainbow / Forest / Net ---
  - id: dang-2020-metabolic-rainbow
    doi: 10.1021/acs.jcim.9b00836
