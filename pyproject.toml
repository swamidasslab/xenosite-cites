[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "template-py-project"
dynamic = ["version"]
description = "Starter Python package for swamidasslab conventions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "S. Joshua Swamidass", email = "swamidass@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/swamidasslab/template-py-project"
Repository = "https://github.com/swamidasslab/template-py-project"
Issues = "https://github.com/swamidasslab/template-py-project/issues"

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-xdist[psutil]>=3.5.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "towncrier>=24.0",
    "mypy>=1.11",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = 'v(?P<version>\d+\.\d+\.\d+(?:[.-].+)?)'
[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/template_py_project/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/template_py_project"]

[tool.pytest.ini_options]
addopts = "--doctest-modules -n auto --cov --cov-report=term-missing --import-mode=importlib"
testpaths = ["tests", "src"]
pythonpath = ["src"]
consider_namespace_packages = true
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source_pkgs = ["template_py_project"]
parallel = true
omit = ["*/_version.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/swamidasslab/template-py-project/releases/tag/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/swamidasslab/template-py-project/issues/{issue})"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
