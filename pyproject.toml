[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "xenosite-cites"
dynamic = ["version"]
description = "Systematic study of citations to XenoSite papers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "S. Joshua Swamidass", email = "swamidass@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]
keywords = ["xenosite", "citations", "bibliometrics", "openalex"]

[project.urls]
Homepage = "https://github.com/swamidasslab/xenosite-cites"
Repository = "https://github.com/swamidasslab/xenosite-cites"
Issues = "https://github.com/swamidasslab/xenosite-cites/issues"

[project.scripts]
xenosite-cites = "xenosite.cites.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-xdist[psutil]>=3.5.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "towncrier>=24.0",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
workflow = [
    "snakemake>=8.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "marimo>=0.24.2",
    "altair>=6.2.2",
    "pandas>=3.0.5",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = 'v(?P<version>\d+\.\d+\.\d+(?:[.-].+)?)'
[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/xenosite/cites/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xenosite"]

[tool.pytest.ini_options]
addopts = "--doctest-modules -n auto --cov --cov-report=term-missing --import-mode=importlib"
testpaths = ["tests", "src"]
pythonpath = ["src"]
consider_namespace_packages = true
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source_pkgs = ["xenosite.cites"]
parallel = true
omit = ["*/_version.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "sklearn.*", "numpy.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/swamidasslab/xenosite-cites/releases/tag/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/swamidasslab/xenosite-cites/issues/{issue})"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
